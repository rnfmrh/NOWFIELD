<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>02 - Glassmorphism</title>
<style>
  body { margin: 0; padding: 0; background-color: #f0f0f0; display: flex; justify-content: center; font-family: 'SF Pro Display', sans-serif; }
  .phone { width: 375px; height: 812px; position: relative; overflow: hidden; background: #fff; box-shadow: 0 20px 40px rgba(0,0,0,0.2); border-radius: 40px; margin-top: 20px; }
  .video-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  .glass-panel { position: absolute; bottom: 80px; left: 16px; right: 16px; padding: 16px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; }
  .title { font-size: 18px; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,0.3); margin-bottom: 4px; }
  .user { font-size: 14px; opacity: 0.9; }
  .badge { display: inline-block; padding: 4px 8px; background: rgba(255,255,255,0.2); border-radius: 10px; font-size: 11px; margin-top: 8px; backdrop-filter: blur(5px); }
  .actions { position: absolute; right: 16px; bottom: 220px; display: flex; flex-direction: column; gap: 16px; }
  .action-btn { width: 48px; height: 48px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 24px; display: flex; justify-content: center; align-items: center; font-size: 20px; color: #fff; }
  .nav { position: absolute; bottom: 0; width: 100%; height: 70px; background: rgba(255,255,255,0.1); backdrop-filter: blur(20px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.2); }
  .nav-item { font-size: 24px; color: rgba(255,255,255,0.6); }
  .nav-item.active { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
</style>
</head>
<body>
<div class="phone">
  <img class="video-bg" src="https://picsum.photos/seed/glass/400/800" alt="bg">
  <div class="actions">
    <div class="action-btn">❤️</div>
    <div class="action-btn">💬</div>
    <div class="action-btn">📤</div>
  </div>
  <div class="glass-panel">
    <div class="title">Incredible sunset at the beach!</div>
    <div class="user">@ocean_vibes · 10m ago</div>
    <div class="badge">✨ Original Capture</div>
  </div>
  <div class="nav">
    <div class="nav-item active">⌂</div>
    <div class="nav-item">◎</div>
    <div class="nav-item" style="font-size:32px;">＋</div>
    <div class="nav-item">🔔</div>
    <div class="nav-item">☺︎</div>
  </div>
</div>
</body>
</html>
