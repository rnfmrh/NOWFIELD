<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>04 - Neon Cyberpunk</title>
<style>
  body { margin: 0; padding: 0; background-color: #0a0a0c; display: flex; justify-content: center; font-family: 'Courier New', Courier, monospace; }
  .phone { width: 375px; height: 812px; position: relative; background: #000; border: 2px solid #0ff; box-shadow: 0 0 20px rgba(0,255,255,0.2); margin-top: 20px; overflow: hidden; }
  .video-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; filter: contrast(1.2) saturate(1.5); opacity: 0.8; }
  .scanline { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 4px, 3px 100%; pointer-events: none; }
  .overlay { position: absolute; bottom: 80px; left: 0; width: 100%; padding: 20px; box-sizing: border-box; background: rgba(0,0,0,0.7); border-top: 1px solid #f0f; }
  .title { font-size: 16px; font-weight: bold; color: #0ff; text-transform: uppercase; text-shadow: 0 0 5px #0ff; margin-bottom: 10px; }
  .metadata { color: #f0f; font-size: 12px; }
  .actions { position: absolute; right: 20px; top: 40%; display: flex; flex-direction: column; gap: 20px; }
  .action-btn { width: 40px; height: 40px; border: 1px solid #0ff; background: rgba(0,255,255,0.1); color: #0ff; border-radius: 4px; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 10px rgba(0,255,255,0.3); }
  .nav { position: absolute; bottom: 0; width: 100%; height: 60px; background: #000; border-top: 2px solid #0ff; display: flex; justify-content: space-around; align-items: center; }
  .nav-item { color: #555; font-weight: bold; }
  .nav-item.active { color: #f0f; text-shadow: 0 0 10px #f0f; }
</style>
</head>
<body>
<div class="phone">
  <img class="video-bg" src="https://picsum.photos/seed/cyber/400/800" alt="bg">
  <div class="scanline"></div>
  <div class="actions">
    <div class="action-btn">SYS</div>
    <div class="action-btn">LOG</div>
    <div class="action-btn">NET</div>
  </div>
  <div class="overlay">
    <div class="title">>> ALERT: HIGH TRAFFIC DETECTED</div>
    <div class="metadata">USR: @NEO_SEOUL | LOC: SECTOR 7 | T: -3m</div>
  </div>
  <div class="nav">
    <div class="nav-item active">[HOME]</div>
    <div class="nav-item">[MAP]</div>
    <div class="nav-item" style="color:#0ff;">[REC]</div>
    <div class="nav-item">[ALT]</div>
    <div class="nav-item">[USR]</div>
  </div>
</div>
</body>
</html>
